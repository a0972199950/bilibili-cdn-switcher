<body>
    <img src="../Icon.png" width="128" height="128" alt="嗶速 - 海外B站加速圖示">
    <p class="platform-ios">你可以在「設定」App 中開啟「嗶速 - 海外B站加速」的 Safari 擴充功能。</p>
    <p class="platform-mac state-unknown" data-newer-text="你可以在「設定」的擴充功能項目中開啟「嗶速 - 海外B站加速」。">你可以在 Safari 偏好設定的「擴充功能」項目中開啟「嗶速 - 海外B站加速」。</p>
    <p class="platform-mac state-on" data-newer-text="「嗶速 - 海外B站加速」擴充功能目前已開啟，可以在「設定」的擴充功能項目中將它關閉。">「嗶速 - 海外B站加速」擴充功能目前已開啟，可以在 Safari 偏好設定的「擴充功能」項目中將它關閉。</p>

    <button class="platform-mac open-preferences" data-newer-text="結束並開啟 Safari 設定…">結束並開啟 Safari 偏好設定…</button>
