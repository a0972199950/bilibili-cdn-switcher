<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <img src="../Icon.png" width="128" height="128" alt="Bilibili CDN Switcher 图标">
    <p class="platform-ios">你可以在“设置”App 中开启 Bilibili CDN Switcher 的 Safari 扩展。</p>
    <p class="platform-mac state-unknown" data-newer-text="你可以在“设置”的扩展项目中开启 Bilibili CDN Switcher。">你可以在 Safari 偏好设置的“扩展”项目中开启 Bilibili CDN Switcher。</p>
    <p class="platform-mac state-on" data-newer-text="Bilibili CDN Switcher 扩展目前已开启，可以在“设置”的扩展项目中将它关闭。">Bilibili CDN Switcher 扩展目前已开启，可以在 Safari 偏好设置的“扩展”项目中将它关闭。</p>
    <p class="platform-mac state-off" data-newer-text="Bilibili CDN Switcher 扩展目前已关闭，可以在“设置”的扩展项目中将它开启。">Bilibili CDN Switcher 扩展目前已关闭，可以在 Safari 偏好设置的“扩展”项目中将它开启。</p>
    <button class="platform-mac open-preferences" data-newer-text="退出并打开 Safari 设置…">退出并打开 Safari 偏好设置…</button>
</body>
</html>
