<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <script src="theme.js"></script>
  <style>
    /* 問題回報頁：background 開的獨立視窗。顏色變數與 popup.html 一致。 */
    :root,
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f4f5f7; --text: #18191c; --muted: #61666d; --placeholder: #9499a0; --line: #e3e5e7; --border: #e3e5e7;
      --control-bg: #fff; --raised: #fff; --accent: #fb7299; --hover-bg: #ffecf1; --selected-bg: #ffdce6; --link: #00aeec;
      --primary: #00aeec; --primary-hover: #0099d1; --primary-text: #fff; --secondary-text: #18191c; --secondary-hover-bg: #f1f2f3;
      --ok: #2ba471; --danger: #d93025; --danger-soft: rgba(217, 48, 37, .1); --warn-bg: #fff4e5; --warn: #b36b00; --code-bg: #fafbfc;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1c1c1e; --text: #eaeaea; --muted: #888; --placeholder: #999; --line: rgba(128, 128, 128, .3); --border: rgba(128, 128, 128, .4);
      --control-bg: transparent; --raised: #2b2b2b; --accent: #00a1d6; --hover-bg: rgba(0, 161, 214, .12); --selected-bg: rgba(0, 161, 214, .18); --link: #00a1d6;
      --primary: #00a1d6; --primary-hover: #0090c0; --primary-text: #fff; --secondary-text: #00a1d6; --secondary-hover-bg: rgba(0, 161, 214, .15);
      --ok: #3ddc84; --danger: #ff6b6b; --danger-soft: rgba(224, 0, 0, .12); --warn-bg: rgba(240, 160, 32, .12); --warn: #e08a00; --code-bg: rgba(255, 255, 255, .06);
    }
    html, body { margin: 0; height: 100%; }
    body {
      font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft JhengHei", "Microsoft YaHei", "Hiragino Sans", "Apple SD Gothic Neo", sans-serif;
      color: var(--text); background: var(--bg);
      display: flex; align-items: flex-start; justify-content: center; box-sizing: border-box; padding: 24px 12px; overflow: auto;
    }
    .card {
      width: 100%; max-width: 720px; background: var(--raised); color: var(--text); border-radius: 12px; box-sizing: border-box;
      padding: 20px 24px 22px; box-shadow: 0 12px 48px rgba(0, 0, 0, .35); position: relative; max-height: calc(100vh - 48px); overflow: auto;
    }
    h1 { font-size: 18px; margin: 0 40px 14px 0; }
    .close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; }
    .close:hover { background: var(--hover-bg); color: var(--text); }
    label.lbl { display: block; font-weight: 600; margin: 14px 0 6px; }
    .types { display: flex; flex-wrap: wrap; gap: 8px; }
    .types label { border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; cursor: pointer; background: var(--control-bg); user-select: none; }
    .types label:hover { background: var(--hover-bg); }
    .types input { display: none; }
    .types label.on { border-color: var(--accent); background: var(--selected-bg); }
    textarea, input[type=text], input[type=email] {
      width: 100%; box-sizing: border-box; font: inherit; color: var(--text); background: var(--control-bg);
      border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; outline: none;
    }
    textarea { min-height: 110px; max-height: 320px; resize: vertical; }
    textarea:focus, input[type=text]:focus, input[type=email]:focus { border-color: var(--accent); }
    ::placeholder { color: var(--placeholder); }
    .diag { margin-top: 14px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--code-bg); }
    .diagHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .diagHead b { font-weight: 600; }
    .linkBtn { border: 0; background: none; color: var(--link); cursor: pointer; font: inherit; padding: 0; }
    .linkBtn:hover { text-decoration: underline; }
    pre#diagPre { display: none; margin: 10px 0 0; max-height: 260px; overflow: auto; font: 12px/1.45 Consolas, Menlo, monospace; white-space: pre; color: var(--text); }
    .note { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
    .note.fieldNote { margin: -2px 0 6px; } /* 欄位標題下方的說明 */
    .under { display: flex; justify-content: space-between; gap: 8px; min-height: 18px; margin-top: 4px; } /* 輸入框下方：左邊校驗訊息、右邊字數 */
    .fieldErr { font-size: 12.5px; }
    .note a { color: var(--link); }
    .actions { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
    button.primary { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 9px 22px; background: var(--primary); color: var(--primary-text); cursor: pointer; }
    button.primary:hover { background: var(--primary-hover); }
    button.primary[disabled] { opacity: .55; cursor: default; }
    button.secondary { font: inherit; border: 1px solid var(--border); border-radius: 8px; padding: 8px 16px; background: var(--control-bg); color: var(--secondary-text); cursor: pointer; }
    button.secondary:hover { background: var(--secondary-hover-bg); }
    .err { color: var(--danger); font-size: 13px; }
    .result { display: none; }
    .result h2 { font-size: 17px; margin: 6px 0 10px; }
    .result.ok h2 { color: var(--ok); }
    .result.fail h2 { color: var(--danger); }
    .result p { margin: 6px 0; white-space: pre-line; }
    .result a { color: var(--link); }
    #counter { color: var(--muted); font-size: 12px; margin-left: auto; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255, 255, 255, .5); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 520px) { body { padding: 8px; } .card { padding: 16px; border-radius: 10px; max-height: calc(100vh - 16px); } }
  </style>
</head>

<body>
  <div class="card">
    <button class="close" id="closeBtn" type="button" aria-label="close">×</button>
    <h1 id="title"></h1>

    <form id="form" novalidate>
      <label class="lbl" id="typeLabel"></label>
      <div class="types" id="types"></div>

      <label class="lbl" for="desc" id="descLabel"></label>
      <div class="note fieldNote" id="descNote"></div>
      <textarea id="desc" maxlength="4000" required></textarea>
      <div class="under"><span class="err fieldErr" id="descErr"></span><span id="counter"></span></div>

      <label class="lbl" for="contact" id="contactLabel"></label>
      <div class="note fieldNote" id="contactNote"></div>
      <input type="email" id="contact" maxlength="200" autocomplete="email" placeholder="example@gmail.com" />
      <div class="under"><span class="err fieldErr" id="contactErr"></span></div>

      <div class="diag" id="diagBox">
        <div class="diagHead">
          <b id="diagTitle"></b>
          <button type="button" class="linkBtn" id="diagToggle"></button>
        </div>
        <pre id="diagPre"></pre>
        <div class="note" id="diagNote"></div>
      </div>

      <div class="actions">
        <button type="submit" class="primary" id="submitBtn"></button>
        <span class="err" id="formErr"></span>
      </div>
    </form>

    <div class="result" id="result">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <p id="resultLink"></p>
      <div class="actions">
        <button type="button" class="primary" id="resultClose"></button>
        <button type="button" class="secondary" id="copyBtn" style="display:none"></button>
        <span class="note" id="copied" style="display:none"></span>
      </div>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="report.js"></script>
</body>

</html>
