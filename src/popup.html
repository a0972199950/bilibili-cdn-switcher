<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CDN 线路</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    }

    h1 {
      font-size: 14px;
      margin: 0 0 10px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 9px 0;
      gap: 8px;
    }

    .hint {
      color: #888;
      font-size: 11px;
      margin: 4px 0 8px;
    }

    hr {
      border: 0;
      border-top: 1px solid rgba(128, 128, 128, .3);
      margin: 12px 0;
    }

    select {
      width: 100%;
      box-sizing: border-box;
      padding: 5px 6px;
      font: inherit;
      margin-bottom: 4px;
    }

    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      display: inline-block;
    }

    .row label.switch {
      flex: 0 0 40px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #bbb;
      border-radius: 22px;
      transition: .15s;
      cursor: pointer;
    }

    .slider::before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: .15s;
    }

    .switch input:checked+.slider {
      background: #00a1d6;
    }

    .switch input:checked+.slider::before {
      transform: translateX(18px);
    }

    #debug {
      font: 12px/1.5 Consolas, Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-all;
      background: rgba(0, 0, 0, .06);
      border: 1px solid rgba(128, 128, 128, .25);
      border-radius: 6px;
      padding: 8px;
      min-height: 72px;
    }

    @media (prefers-color-scheme: dark) {
      #debug {
        background: rgba(255, 255, 255, .06);
      }
    }

    .cdnnow {
      color: #00a1d6;
      font-weight: 600;
    }

    .cdnMode {
      display: flex;
      gap: 18px;
      margin: 4px 0 8px;
    }

    .cdnMode label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    button#speedtestBtn {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font: inherit;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid rgba(128, 128, 128, .4);
      background: transparent;
      color: inherit;
    }

    button#speedtestBtn:disabled {
      opacity: .5;
      cursor: default;
    }

    #speedtestView {
      display: none;
    }

    .stHeader {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
    }

    button#stBackBtn,
    button#stRetestBtn {
      padding: 4px 10px;
      font: inherit;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid rgba(128, 128, 128, .4);
      background: transparent;
      color: inherit;
      white-space: nowrap;
    }

    #stMeta {
      margin: 0 0 8px;
    }

    #stMeta .stTitle {
      display: block;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      white-space: normal;
      word-break: break-word;
    }

    #stMeta .stQn {
      display: block;
      font-size: 12px;
      font-weight: 400;
      color: #888;
      margin-top: 2px;
    }

    #stList {
      font: 12px/1.8 Consolas, Menlo, monospace;
      max-height: 320px;
      overflow-y: auto;
    }

    .stRow {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 0;
    }

    .stRow .stSpeed {
      white-space: nowrap;
      color: #888;
    }

    .stRow.stTesting .stSpeed {
      color: #00a1d6;
    }

    .stRow.stBest .stSpeed {
      color: #00a1d6;
      font-weight: 600;
    }

    .stRow.stErr .stSpeed {
      color: #e00;
    }
  </style>
</head>

<body>
  <div id="mainView">
    <h1>B 站 CDN 线路</h1>

    <div class="row">
      <span><b>启用</b></span>
      <label class="switch"><input type="checkbox" id="enabled" /><span class="slider"></span></label>
    </div>

    <div class="row"><label>CDN 线路（换成此节点并排最前，原节点保留为 fallback）</label></div>
    <div class="cdnMode">
      <label><input type="radio" name="cdnMode" id="modeList" /> 清单选择</label>
      <label><input type="radio" name="cdnMode" id="modeCustom" /> 自行输入</label>
    </div>
    <select id="cdnHost"></select>
    <input type="text" id="customHost" spellcheck="false" placeholder="输入 CDN host，例：upos-sz-mirrorxxx.bilivideo.com"
      style="display:none;width:100%;box-sizing:border-box;padding:5px 6px;font:inherit;margin-bottom:4px" />
    <div class="hint" id="customHint" style="display:none">只填 host（网域），不含 http:// 与路径。</div>

    <div class="row" style="margin-top:16px">
      <button id="speedtestBtn" type="button">🔍 测试各节点速度</button>
    </div>

    <div class="row">
      <span>显示页面 debug 叠层</span>
      <label class="switch"><input type="checkbox" id="showDebug" /><span class="slider"></span></label>
    </div>

    <hr />
    <div class="row" style="margin:0 0 6px"><label><b>Debug</b>（当前分页）</label></div>
    <div id="debug">尚未取得资料，请在 B 站影片页开启。</div>
  </div>

  <div id="speedtestView">
    <div class="stHeader">
      <button id="stBackBtn" type="button">← 返回</button>
      <b>各节点测速</b>
      <button id="stRetestBtn" type="button" style="margin-left:auto">🔄 重新测速</button>
    </div>
    <div id="stMeta"></div>
    <div class="hint">用「当前影片、当前画质」的分段实测各节点；
      离开此页会立即停止测速。</div>
    <div class="hint">这里测到的是各节点的<b>理论最大频宽</b>，跟播放当下实际用到的速度不同——影片可能根本用不到
      这么高的频宽，所以比 debug 叠层看到的数字高是正常的。</div>
    <div id="stList"></div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
