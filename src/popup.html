<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <!-- 外觀主題要在畫面出來前套上，不然會先閃一下另一個主題，所以放 <head> 同步載入 -->
  <script src="theme.js"></script>
  <style>
    /* 外觀主題：theme.js 依進階設定（跟隨系統／明亮／黑暗）在 <html> 設 data-theme="light" | "dark"，
       顏色一律透過下面的變數取用。黑暗＝原本的深色設計；明亮參照測速工具 CDNSpeedTest 的配色
       （淺灰底＋白色卡片、B 站粉主色、天藍連結）。 */
    :root,
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f4f5f7;
      --bg-clear: rgba(244, 245, 247, 0);
      --text: #18191c;
      --muted: #61666d;
      --placeholder: #9499a0;
      --line: #e3e5e7;
      --border: #e3e5e7;
      --border-soft: #e3e5e7;
      --control-bg: #fff;
      --raised: #fff;
      --accent: #fb7299;
      --accent-hover: #e85c86;
      --accent-text: #fff;
      --hover-bg: #ffecf1;
      --selected-bg: #ffdce6;
      --link: #00aeec;
      --primary: #00aeec;
      --primary-hover: #0099d1;
      --primary-text: #fff;
      --secondary-border: #e3e5e7;
      --secondary-text: #18191c;
      --secondary-hover-bg: #f1f2f3;
      --radio-border: #c9ccd0;
      --ok: #2ba471;
      --fair: #c98a00;
      --danger: #d93025;
      --danger-strong: #d93025;
      --danger-hover: #b3261e;
      --danger-soft: rgba(217, 48, 37, .1);
      --danger-border: rgba(217, 48, 37, .55);
      --warn: #b36b00;
      --warn-bar: #f0a020;
      --warn-bg: #fff4e5;
      --slider-off: #c9ccd0;
      --tag-fix: #9499a0;
      --code-bg: #fafbfc;
      --promo-bg: #e6f7fd;
      --promo-border: #b3e6f8;
      --promo-text: #61666d;
      --top-bar: #fb7299;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1c1c1e;
      --bg-clear: rgba(28, 28, 30, 0);
      --text: #eaeaea;
      --muted: #888;
      --placeholder: #999;
      --line: rgba(128, 128, 128, .3);
      --border: rgba(128, 128, 128, .4);
      --border-soft: rgba(128, 128, 128, .25);
      --control-bg: transparent;
      --raised: #2b2b2b;
      --accent: #00a1d6;
      --accent-hover: #0090c0;
      --accent-text: #fff;
      --hover-bg: rgba(0, 161, 214, .12);
      --selected-bg: rgba(0, 161, 214, .18);
      --link: #00a1d6;
      --primary: #00a1d6;
      --primary-hover: #0090c0;
      --primary-text: #fff;
      --secondary-border: #00a1d6;
      --secondary-text: #00a1d6;
      --secondary-hover-bg: #00a1d6;
      --radio-border: #888;
      --ok: #3ddc84;
      --fair: #ffc83d;
      --danger: #ff6b6b;
      --danger-strong: #e00;
      --danger-hover: #c62828;
      --danger-soft: rgba(224, 0, 0, .1);
      --danger-border: rgba(255, 107, 107, .55);
      --warn: #e08a00;
      --warn-bar: #f0a020;
      --warn-bg: rgba(240, 160, 32, .12);
      --slider-off: #bbb;
      --tag-fix: #8a8a8a;
      --code-bg: rgba(255, 255, 255, .06);
      --promo-bg: rgba(0, 161, 214, .08);
      --promo-border: rgba(0, 161, 214, .35);
      --promo-text: #aaa;
      --top-bar: transparent;
    }

    /* 明确给不透明底色：macOS（新版毛玻璃/vibrancy）会让没设背景的 popup 变半透明，
       视频透上来使灰字与细线几乎看不清。铺满不透明背景即可，跟其他浏览器观感一致。 */
    html {
      background: var(--bg);
    }

    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      /* 明亮主題頂端的粉色細條（同 CDNSpeedTest 標題下的分隔線）；用 inset 陰影畫在 padding 裡，不影響版面高度 */
      box-shadow: inset 0 3px 0 var(--top-bar);
    }

    /* 日文：依詞組換行（Chrome / Edge 119+ 的 auto-phrase），避免把「経過」「再読み込み」之類的詞拆開；
       不支援的瀏覽器會忽略這條、退回一般規則。line-break: strict 讓小寫假名、長音符不會跑到行首。 */
    :lang(ja) {
      word-break: auto-phrase;
      line-break: strict;
    }

    /* 韓文：單字之間本來就有空格，照空格換行（keep-all），不在字中間斷開；
       真的放不下的長字串（網址等）再由 overflow-wrap 強制斷。 */
    :lang(ko) {
      word-break: keep-all;
      overflow-wrap: break-word;
    }


    h1 {
      font-size: 14px;
      margin: 0 0 10px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 9px 0;
      gap: 8px;
    }

    .hint {
      color: var(--muted);
      font-size: 11px;
      margin: 4px 0 8px;
    }

    hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 12px 0;
    }

    .cdnSelect {
      position: relative;
      margin-bottom: 4px;
    }

    .cdnSelectTrigger {
      width: 100%;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 8px;
      font: inherit;
      text-align: left;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--control-bg);
      color: inherit;
    }

    .cdnSelectText {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .cdnSelectName {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cdnSelectHost {
      font-size: 10px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cdnSelectArrow {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 10px;
      transition: transform .15s;
    }

    .cdnSelect.open .cdnSelectArrow {
      transform: rotate(180deg);
    }

    .cdnSelectList {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      max-height: 220px;
      overflow-y: auto;
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
      z-index: 10;
    }

    .cdnSelect.open .cdnSelectList {
      display: block;
    }

    .cdnOptRow {
      display: flex;
      flex-direction: column;
      padding: 5px 8px;
      cursor: pointer;
    }

    .cdnOptRow:hover {
      background: var(--hover-bg);
    }

    .cdnOptRow.selected {
      background: var(--selected-bg);
    }

    .cdnOptRow.selected .cdnOptName {
      font-weight: 600;
    }

    .cdnOptName {
      overflow-wrap: break-word;
    }

    .cdnOptHost {
      font-size: 10px;
      color: var(--muted);
    }

    /* 自訂節點列表：每列右側的移除鈕 */
    .cdnOptRow.hasDel {
      position: relative;
      padding-right: 30px;
    }

    .cdnOptDel {
      position: absolute;
      top: 50%;
      right: 4px;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font: 14px/22px sans-serif;
      cursor: pointer;
    }

    .cdnOptDel:hover {
      background: var(--danger-soft);
      color: var(--danger-strong);
    }

    .customDesc {
      color: var(--muted);
      font-size: 11px;
      margin: 2px 0 8px;
    }

    .customDesc p {
      margin: 0 0 4px;
    }

    .customDesc a {
      color: var(--link);
      cursor: pointer;
    }

    .customAddRow {
      display: flex;
      gap: 6px;
      margin-bottom: 4px;
    }

    .customAddRow input {
      flex: 1 1 auto;
      min-width: 0;
      box-sizing: border-box;
      padding: 5px 6px;
      font: inherit;
    }

    .customAddRow button {
      flex: 0 0 auto;
      font: inherit;
      padding: 4px 12px;
      cursor: pointer;
    }

    #customAddBox {
      margin-top: 6px;
    }

    /* 自訂節點列表是空的：仍顯示下拉外框，但不能展開，文字當 placeholder（不套用按鈕的停用變淡） */
    .cdnSelect.empty .cdnSelectTrigger:disabled {
      opacity: 1;
      filter: none;
    }

    .cdnSelect.empty .cdnSelectName,
    .cdnSelect.empty .cdnSelectArrow {
      color: var(--placeholder);
    }

    /* 清空：跟「加入」同尺寸，紅底白字 */
    .customAddRow button.customClearBtn {
      border: 1px solid var(--danger-strong);
      border-radius: 3px;
      background: var(--danger-strong);
      color: #fff;
    }

    .customAddRow button.customClearBtn:hover:not(:disabled) {
      background: var(--danger-hover);
      border-color: var(--danger-hover);
    }

    /* 官方測速工具的推廣卡：淺藍底，整列藍色按鈕「自動偵測並加入」 */
    .autoDetectCard {
      margin: 0 0 8px;
      padding: 8px 10px;
      border: 1px solid var(--promo-border);
      border-radius: 8px;
      background: var(--promo-bg);
    }

    .autoDetectCard p {
      margin: 0 0 6px;
      font-size: 11px;
      color: var(--promo-text);
    }

    button#autoDetectBtn {
      width: 100%;
      padding: 6px 8px;
      border: 0;
      border-radius: 6px;
      background: var(--primary);
      color: var(--primary-text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button#autoDetectBtn:hover {
      background: var(--primary-hover);
    }

    /* 國家清單下方：沒有你的國家時的引導，「自訂節點列表」是切換模式的連結按鈕 */
    .linkBtn {
      padding: 0;
      border: 0;
      background: none;
      color: var(--link);
      font: inherit;
      text-decoration: underline;
      cursor: pointer;
    }

    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      display: inline-block;
    }

    .row label.switch {
      flex: 0 0 40px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: var(--slider-off);
      border-radius: 22px;
      transition: .15s;
      cursor: pointer;
    }

    .slider::before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: .15s;
    }

    .switch input:checked+.slider {
      background: var(--accent);
    }

    .switch input:checked+.slider::before {
      transform: translateX(18px);
    }

    #debug {
      font: 12px/1.5 Consolas, Menlo, monospace;
      white-space: pre-wrap;
      /* 網址等長字串照樣能斷，但一般文字（尚無資料的提示）不會被逐字拆開，日韓文的換行規則也照常套用 */
      overflow-wrap: anywhere;
      background: var(--code-bg);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      padding: 8px;
      min-height: 72px;
    }

    .cdnnow {
      color: var(--accent);
      font-weight: 600;
    }

    .cdnMode {
      display: flex;
      gap: 12px;
      margin: 4px 0 8px;
    }

    .cdnMode label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    button#speedtestBtn,
    button#liveSpeedtestBtn {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font: inherit;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--control-bg);
      color: inherit;
    }

    /* 所有按鈕的停用狀態：灰階變淡、點不了，游標顯示禁止（各按鈕的 id 選擇器會設 cursor: pointer，所以用 !important 蓋過） */
    button:disabled {
      opacity: .45;
      filter: grayscale(1);
      cursor: not-allowed !important;
    }

    #speedtestView {
      display: none;
    }

    /* 測速頁：清單用 flex 填滿 popup 實際可見高度。
       popup 視窗大小由內容決定（上限 600 DIP；頁面縮放 110% 時只剩約 545 CSS px），flex 需要確定的外層高度，所以分兩段：
       先讓 html 撐到 600px 向瀏覽器要最大的 popup，等視窗大小穩定後，popup.js 再把 html 高度鎖成實際可見高度
       （不鎖的話，縮放超過 100% 時 600px 會超出可見範圍，Chrome 在外層加捲動條、底部多出空白）。
       排版用 100vh（= popup 真正可見的高度），標題、說明、按鈕固定高，剩下的空間都給清單 */
    html.stMode {
      height: 600px;
      overflow: hidden;
    }

    html.stMode body {
      height: calc(100vh - 28px); /* 扣掉 body 上下 padding；不用 border-box，免得寬度也被 padding 吃掉、跟主頁不一樣寬 */
      overflow: hidden;
    }

    html.stMode #speedtestView {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    #speedtestView > * {
      flex: 0 0 auto;
    }

    .stHeader {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
    }

    #advancedView,
    #changelogView {
      display: none;
    }

    /* 主頁左下角的版本號：點了進「版本更新紀錄」頁 */
    .versionRow {
      margin-top: 10px;
    }

    .versionRow button.linkBtn {
      color: var(--muted);
      font-size: 11px;
    }

    .clRelease {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .clRelease:last-child {
      border-bottom: 0;
    }

    .clHead {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 0 0 4px;
    }

    .clVersion {
      font-weight: 600;
    }

    .clVersion .clCurrent {
      margin-left: 6px;
      font-size: 11px;
      font-weight: 400;
      color: var(--accent);
    }

    .clDate {
      font-size: 11px;
      color: var(--muted);
    }

    .clRelease ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .clRelease li {
      margin: 5px 0;
      line-height: 1.45;
    }

    /* 警告型 alert（參考 Ant Design / MUI 的 Alert）：左側色條＋圖示、粗體標題＋說明，動作做成文字連結而不是按鈕 */
    #staleBanner {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 0 0 10px;
      padding: 8px 10px 8px 9px;
      border-left: 3px solid var(--warn-bar);
      border-radius: 4px;
      background: var(--warn-bg);
      font-size: 12px;
      line-height: 1.5;
    }

    #staleBanner .alertIcon {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      margin-top: 1px;
      fill: var(--warn-bar);
    }

    #staleBanner .alertBody {
      flex: 1 1 auto;
      min-width: 0;
    }

    #staleBanner .alertTitle {
      font-weight: 600;
    }

    #staleBanner .alertDesc {
      color: var(--muted);
    }

    #staleBanner .alertAction {
      flex: 0 0 auto;
      align-self: center;
      padding: 0;
      border: 0;
      background: none;
      font: inherit;
      font-weight: 600;
      color: var(--link);
      cursor: pointer;
      white-space: nowrap;
    }

    #staleBanner .alertAction:hover {
      text-decoration: underline;
    }

    .advItem {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    /* 暫時不能用的選項（例如自動測速在國家選「全部」時）：開關變淡、不能按，底下用橘字說明原因 */
    .advItem.disabled .row,
    .advItem.disabled .hint:not(.advDisabledNote) {
      opacity: .5;
    }

    .advItem.disabled .slider {
      cursor: not-allowed;
    }

    .hint.advDisabledNote {
      color: var(--warn);
    }

    .advItem:last-child {
      border-bottom: 0;
    }

    .advItem .row {
      margin: 0;
    }

    .advItem .hint {
      margin: 4px 0 0;
    }

    .advTitle {
      font-weight: 600;
      margin: 0 0 6px;
    }

    .numRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 6px 0;
    }

    .numRow input {
      width: 64px;
      box-sizing: border-box;
      padding: 3px 6px;
      font: inherit;
      text-align: right;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--control-bg);
      color: inherit;
    }

    .numRow .unit {
      display: inline-block;
      min-width: 22px;
      margin-left: 4px;
      color: var(--muted);
    }

    /* 「恢復預設」：沒有外框、像超連結的底線文字 */
    button.linkBtn {
      padding: 0;
      border: 0;
      background: none;
      font: inherit;
      font-size: 12px;
      color: var(--link);
      text-decoration: underline;
      cursor: pointer;
    }

    .advItem .linkRow {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }

    /* 進階設定最下方的「恢復原始設置」：置中紅字 */
    .resetAllRow {
      margin: 14px 0 4px;
      text-align: center;
    }

    button#resetAllBtn {
      color: var(--danger);
    }

    .stActions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin: 8px 0;
    }

    /* 停止：跟重新測速同尺寸，紅字紅框；沒在測時變淡、不能按 */
    button#stStopBtn {
      padding: 4px 10px;
      font: inherit;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid var(--danger-border);
      background: var(--control-bg);
      color: var(--danger);
      white-space: nowrap;
    }

    button#stStopBtn:hover:not(:disabled) {
      background: var(--danger-soft);
    }

    button#stBackBtn,
    button#advBackBtn,
    button#clBackBtn,
    button#stRetestBtn {
      padding: 4px 10px;
      font: inherit;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--control-bg);
      color: inherit;
      white-space: nowrap;
    }

    /* 測速頁各區塊固定高度（影片標題是動態載入的，不能等它載完再算）：
       標題最多兩行＋畫質一行；說明區固定三行，超出時用箭頭展開；清單區填滿剩下的高度 */
    #stMeta {
      height: 57px;
      margin: 0 0 6px;
      overflow: hidden;
    }

    #stMeta .stTitle {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      max-height: 2.8em;
      white-space: normal;
      word-break: break-word;
    }

    #stDesc {
      position: relative;
      height: 52px;
      margin: 0 0 4px;
    }

    #stDescInner {
      height: 100%;
      overflow: hidden;
    }

    #stDescInner .hint {
      margin: 0 0 4px;
      line-height: 16px;
    }

    /* 收合且有被截掉的文字：底部淡出，不會看到被切一半的字 */
    #stDesc.overflowing:not(.expanded)::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      pointer-events: none;
      background: linear-gradient(to bottom, var(--bg-clear), var(--bg));
    }

    /* 展開：改成 fixed 浮在原位上方，不推動下面的版面 */
    #stDesc.expanded #stDescInner {
      position: fixed;
      z-index: 50;
      height: auto;
      overflow-y: auto;
      box-sizing: border-box;
      padding: 0 0 22px;
      background: var(--bg);
      box-shadow: 0 6px 12px -4px rgba(0, 0, 0, .3);
    }

    /* 展開／收合箭頭：收合時壓在第三行右下角，左邊用漸層淡出文字 */
    button#stDescToggle {
      display: none;
      position: absolute;
      right: 0;
      bottom: 0;
      padding: 0 2px 0 22px;
      border: 0;
      font-size: 14px;
      line-height: 16px;
      color: var(--accent);
      cursor: pointer;
      z-index: 1;
      background: linear-gradient(to right, var(--bg-clear), var(--bg) 18px);
    }

    #stDesc.overflowing button#stDescToggle {
      display: block;
    }

    #stMeta .stQn {
      display: block;
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 2px;
    }

    #stList {
      font: 12px/1.8 Consolas, Menlo, monospace;
      overflow-y: auto;
    }

    .stRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 4px;
      border-bottom: 1px solid var(--line);
    }

    .stRow:last-child {
      border-bottom: 0;
    }

    /* 直播列：第 1 行线路名、第 2 行网址、第 3 行左右各一个指标 */
    .stRow.stRowLive {
      flex-direction: column;
      align-items: stretch;
      gap: 0;
    }

    .stRow.stClickable {
      cursor: pointer;
    }

    .stRow.stClickable:hover {
      background: var(--hover-bg);
    }

    .stRow.stCurrent {
      background: var(--selected-bg);
    }

    .stRow.stCurrent .stRowTitle {
      font-weight: 600;
    }

    .stRowMain {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .stRowTitle {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stRowHost {
      font-size: 10px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stRow .stSpeed {
      flex: 0 0 auto;
      white-space: nowrap;
      color: var(--muted);
    }

    .stRow.stTesting .stSpeed {
      color: var(--accent);
    }

    .stRow.stBest .stSpeed {
      color: var(--accent);
      font-weight: 600;
    }

    .stRow.stErr .stSpeed {
      color: var(--danger-strong);
    }

    .stRow.stMissing .stRowTitle,
    .stRow.stMissing .stRowHost {
      opacity: .5;
    }

    .stRow .stRowNote {
      margin-left: 6px;
      font-size: 11px;
      color: var(--warn);
    }

    .stRow .stMetrics {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 2px;
      font-size: 11px;
      line-height: 1.6;
      white-space: nowrap;
      color: var(--muted);
    }

    .stMetrics .stMetricLabel {
      color: var(--muted);
    }

    .stMetrics .stMetricErr {
      color: var(--danger-strong);
    }

    .lvTesting {
      color: var(--accent);
    }

    .lvGood {
      color: var(--ok);
      font-weight: 600;
    }

    .lvFair {
      color: var(--fair);
      font-weight: 600;
    }

    .lvBad {
      color: var(--danger);
      font-weight: 600;
    }

    .headerRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 10px;
      /* 評分按鈕不縮不換行，塞不下時整顆掉到第二行，不要反過來把標題擠成多行 */
      flex-wrap: wrap;
    }

    .headerRow h1 {
      margin: 0;
      min-width: 0;
      line-height: 1.35;
    }

    button.iconBtn {
      flex: 0 0 auto;
      height: 28px;
      padding: 0 10px 0 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font: inherit;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      border-radius: 14px;
      border: 1px solid var(--secondary-border);
      background: var(--control-bg);
      color: var(--secondary-text);
    }

    button.iconBtn:hover {
      color: var(--primary-text);
      background: var(--secondary-hover-bg);
    }

    /* 明亮主題：次要按鈕 hover 只淡灰底，不反白；齒輪圖示用主題粉點綴 */
    :root[data-theme="light"] button.iconBtn:hover {
      color: var(--secondary-text);
    }

    :root[data-theme="light"] button.iconBtn svg {
      fill: var(--accent);
    }

    button.iconBtn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .tabs {
      display: flex;
      margin: 10px 0 10px;
      border-bottom: 1px solid var(--line);
    }

    button.tab {
      flex: 1 1 0;
      padding: 6px 8px;
      font: inherit;
      cursor: pointer;
      border: 0;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      background: transparent;
      color: var(--muted);
    }

    button.tab:hover {
      color: inherit;
    }

    button.tab.active {
      color: var(--accent);
      font-weight: 600;
      border-bottom-color: var(--accent);
    }

    /* 直播下拉：這個直播沒有此線路 → 名稱與網址變淡並加註記，但仍可點選（不禁止使用者選） */
    .cdnOptRow.missing .cdnOptName,
    .cdnOptRow.missing .cdnOptHost,
    .cdnSelectTrigger.missing .cdnSelectName,
    .cdnSelectTrigger.missing .cdnSelectHost {
      opacity: .55;
    }

    .liveMissingNote {
      margin-left: 6px;
      font-size: 11px;
      color: var(--warn);
    }

    .footerBtns {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }

    .footerBtns button {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font: inherit;
      cursor: pointer;
      border-radius: 6px;
    }

    button#feedbackBtn {
      border: 1px solid var(--border);
      background: var(--control-bg);
      color: inherit;
    }

    /* 5 星鼓勵：與「問題回報」同尺寸，放在它上面；配色沿用原本的金色外框＋淡金底 */
    button#rateBtn {
      border: 1px solid rgba(255, 170, 0, .5);
      background: rgba(255, 170, 0, .12);
      color: inherit;
    }

    button#rateBtn:hover {
      background: rgba(255, 170, 0, .22);
    }

    /* 國家選擇：只在「清單選擇」模式顯示，切換後節點下拉只列該國建議節點 */
    /* 國家選擇在左、節點數在右，同一行，下面才是節點下拉 */
    .countryRow {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 0 0 6px;
    }

    /* 國家選擇：灰色文字＋底線＋向下箭頭，不要框。
       收合時顯示 #countryText（不含「你在這裡」），透明的原生 select 疊在上面負責點擊與展開清單 */
    .countryPick {
      position: relative;
      flex: 0 1 auto;
      min-width: 0;
      max-width: 75%;
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      padding-bottom: 1px;
      border-bottom: 1px solid currentColor;
      color: var(--muted);
      cursor: pointer;
    }

    .countryPick:hover,
    .countryPick:focus-within {
      color: var(--accent);
    }

    /* 國名太長時截斷成「…」，不要把節點下拉擠扁 */
    #countryText,
    #uiLangText,
    #uiThemeText {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .countryPick .countryArrow {
      font-size: 10px;
    }

    .countryPick select {
      position: absolute;
      inset: 0;
      width: 100%;
      opacity: 0;
      font: inherit;
      cursor: pointer;
    }

    .countryPick select option {
      background: var(--raised);
      color: var(--text);
      font-weight: 400;
    }

    /* 目前選項有幾個節點：灰色小字 */
    .countryCount {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .countryCount.all {
      color: var(--danger-strong);
    }

    /* 測速前三名：右上角戴金／銀／銅皇冠，順時針轉 30 度 */
    #stList {
      padding-top: 4px;
    }

    #speedtestView > #stList {
      flex: 1 1 0;
      min-height: 120px;
      overflow-x: hidden; /* 旋轉的皇冠會凸出右緣，不要因此出現橫向捲動條 */
    }

    .stRow {
      position: relative;
    }

    .stCrown {
      position: absolute;
      top: -4px;
      right: 3px; /* 清單不能橫向捲動，旋轉後要留在右緣內才不會被切掉 */
      width: 17px;
      height: 17px;
      transform: rotate(30deg);
      pointer-events: none;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .35));
    }

    .stCrown.gold {
      fill: #f5b800;
    }

    .stCrown.silver {
      fill: #b4bcc4;
    }

    .stCrown.bronze {
      fill: #c87533;
    }

    /* 「全部」節點測速前的警告：紅色調，主按鈕是「取消」，引導使用者改選國家 */
    #allWarn {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 110;
      background: rgba(0, 0, 0, .5);
      align-items: center;
      justify-content: center;
      padding: 14px;
      box-sizing: border-box;
    }

    #allWarn.show {
      display: flex;
    }

    .awCard {
      width: 100%;
      max-height: 100%;
      overflow-y: auto;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 10px;
      border-top: 4px solid var(--danger-strong);
      background: var(--raised);
      color: var(--text);
      box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
    }

    .awHead {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 600;
      color: var(--danger);
    }

    .awHead svg {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      fill: var(--danger);
    }

    .awCard p {
      margin: 0 0 8px;
      line-height: 1.55;
    }

    .awCard p b {
      color: var(--danger);
    }

    .awBtns {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
      margin-top: 12px;
    }

    button#awCancel {
      padding: 7px 8px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      border: 0;
      background: var(--primary);
      color: var(--primary-text);
    }

    button#awConfirm {
      align-self: center;
      padding: 2px 4px;
      border: 0;
      background: none;
      font: inherit;
      font-size: 11px;
      color: var(--danger-strong);
      opacity: .8;
      text-decoration: underline;
      cursor: pointer;
    }

    /* 一般確認框（清空自訂節點列表）：不引導取消，取消在左、確認（藍色）在右 */
    #allWarn.plain .awBtns {
      flex-direction: row;
    }

    #allWarn.plain .awBtns button {
      flex: 1 1 0;
      align-self: stretch;
      padding: 7px 8px;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      opacity: 1;
      border-radius: 6px;
      cursor: pointer;
    }

    #allWarn.plain button#awConfirm {
      border: 0;
      background: var(--primary);
      color: var(--primary-text);
    }

    #allWarn.plain button#awCancel {
      border: 1px solid var(--border);
      background: var(--control-bg);
      color: inherit;
    }

    /* 更新後的「更新內容」提示：蓋在整個 popup 上的一次性遮罩，關閉後才把新版本號寫進 storage */
    #whatsNew {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, .45);
      align-items: center;
      justify-content: center;
      padding: 14px;
      box-sizing: border-box;
    }

    #whatsNew.show {
      display: flex;
    }

    .wnCard {
      width: 100%;
      max-height: 100%;
      overflow-y: auto;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 10px;
      background: var(--raised);
      color: var(--text);
      box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
    }

    .wnHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 6px;
    }

    #wnTitle {
      font-size: 15px;
      font-weight: 600;
    }

    button#wnX {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: 18px/1 inherit;
      cursor: pointer;
      padding: 0 2px;
    }

    #wnSubtitle {
      color: var(--muted);
      font-size: 12px;
      margin: 0 0 6px;
    }

    #wnList {
      margin: 0 0 12px;
      padding: 0;
      list-style: none;
    }

    #wnList li {
      margin: 6px 0;
      line-height: 1.45;
    }

    .wnTag {
      display: inline-block;
      margin-right: 6px;
      padding: 0 6px;
      border-radius: 8px;
      font-size: 11px;
      color: var(--accent-text);
      background: var(--accent);
    }

    .wnTag.fix {
      background: var(--tag-fix);
    }

    button#wnClose {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font: inherit;
      cursor: pointer;
      border-radius: 6px;
      border: 0;
      background: var(--primary);
      color: var(--primary-text);
    }

    /* 明亮主題：進階設定各項、更新紀錄各版、測速清單做成白色圓角卡片（CDNSpeedTest 的灰底白卡） */
    :root[data-theme="light"] .advItem,
    :root[data-theme="light"] .clRelease {
      margin: 0 0 8px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--raised);
    }

    :root[data-theme="light"] .advItem:last-child,
    :root[data-theme="light"] .clRelease:last-child {
      border-bottom: 1px solid var(--line);
    }

    :root[data-theme="light"] #stList {
      padding: 4px 6px 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--raised);
    }

    /* 明亮主題：原生 radio 跟主色一致，輸入框與「加入／清空」按鈕改成白卡圓角（黑暗主題維持原生外觀） */
    /* 明亮主題：鍵盤焦點改成淡藍光暈，取代原生的粗黑框（確認框開啟時會自動聚焦按鈕） */
    :root[data-theme="light"] button:focus-visible,
    :root[data-theme="light"] select:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(0, 174, 236, .3);
    }

    :root[data-theme="light"] input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      flex: 0 0 auto;
      width: 15px;
      height: 15px;
      margin: 0 2px 0 0;
      border: 1.5px solid var(--radio-border);
      border-radius: 50%;
      background: var(--control-bg);
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }

    :root[data-theme="light"] input[type="radio"]:hover {
      border-color: var(--accent);
    }

    :root[data-theme="light"] input[type="radio"]:checked {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 3px var(--control-bg);
      background: var(--accent);
    }

    :root[data-theme="light"] input[type="radio"]:focus-visible {
      outline: 2px solid var(--hover-bg);
      outline-offset: 1px;
    }

    :root[data-theme="light"] .customAddRow input,
    :root[data-theme="light"] .customAddRow button {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--control-bg);
      color: var(--text);
      outline-color: var(--primary);
    }

    :root[data-theme="light"] .customAddRow button:hover:not(:disabled) {
      background: var(--hover-bg);
    }

    :root[data-theme="light"] .customAddRow button.customClearBtn {
      border-color: var(--danger-strong);
      background: var(--danger-strong);
      color: #fff;
    }

    :root[data-theme="light"] .customAddRow button.customClearBtn:hover:not(:disabled) {
      border-color: var(--danger-hover);
      background: var(--danger-hover);
    }

    :root[data-theme="light"] .cdnSelectList {
      border-color: var(--line);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
    }

  </style>
</head>

<body>
  <div id="mainView">
    <div class="headerRow">
      <h1 id="headerTitle"></h1>
      <button id="gearBtn" type="button" class="iconBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
        </svg>
        <span id="gearBtnLabel"></span>
      </button>
    </div>

    <div id="staleBanner" role="alert" style="display:none">
      <svg class="alertIcon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z" />
      </svg>
      <div class="alertBody">
        <div class="alertTitle" id="staleTitle"></div>
        <div class="alertDesc" id="staleText"></div>
      </div>
      <button id="staleReloadBtn" class="alertAction" type="button"></button>
    </div>

    <div class="row">
      <span><b id="enabledLabel"></b></span>
      <label class="switch"><input type="checkbox" id="enabled" /><span class="slider"></span></label>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" class="tab active" id="tabVideo" role="tab"></button>
      <button type="button" class="tab" id="tabLive" role="tab"></button>
    </div>

    <div id="panelVideo">
      <div class="row"><label id="cdnHostRowLabel"></label></div>
      <div class="cdnMode">
        <label><input type="radio" name="cdnMode" id="modeList" /> <span id="modeListLabel"></span></label>
        <label><input type="radio" name="cdnMode" id="modeCustom" /> <span id="modeCustomLabel"></span></label>
        <label><input type="radio" name="cdnMode" id="modeOff" /> <span id="modeOffLabel"></span></label>
      </div>
      <div class="countryRow" id="countryRow">
        <span class="countryPick"><span id="countryText"></span><span class="countryArrow" aria-hidden="true">▾</span><select id="countrySelect"></select></span>
        <span class="countryCount" id="countryCount"></span>
      </div>
      <div id="customBox" style="display:none">
        <div class="customDesc" id="customDesc"></div>
        <div class="countryRow">
          <span class="countryCount" id="customCount"></span>
        </div>
      </div>
      <div class="cdnSelect" id="cdnSelect">
        <button type="button" class="cdnSelectTrigger" id="cdnSelectTrigger">
          <span class="cdnSelectText">
            <span class="cdnSelectName" id="cdnSelectName"></span>
            <span class="cdnSelectHost" id="cdnSelectHost"></span>
          </span>
          <span class="cdnSelectArrow">▾</span>
        </button>
        <div class="cdnSelectList" id="cdnSelectList"></div>
      </div>
      <div class="hint" id="countryHint"></div>
      <div id="customAddBox" style="display:none">
        <div class="autoDetectCard">
          <p id="autoDetectText"></p>
          <button type="button" id="autoDetectBtn"></button>
        </div>
        <div class="customAddRow">
          <input type="text" id="customHost" spellcheck="false" />
          <button type="button" id="customAddBtn"></button>
          <button type="button" class="customClearBtn" id="customClearBtn"></button>
        </div>
        <div class="hint" id="customHint" style="display:none"></div>
      </div>
      <div class="hint" id="videoOffHint" style="display:none"></div>

      <div class="row" style="margin-top:16px">
        <button id="speedtestBtn" type="button"></button>
      </div>
    </div>

    <div id="panelLive" style="display:none">
      <div class="row"><label id="liveRouteRowLabel"></label></div>
      <div class="hint" id="liveRouteExplain"></div>
      <div class="cdnMode">
        <label><input type="radio" name="liveMode" id="liveModeList" /> <span id="liveModeListLabel"></span></label>
        <label><input type="radio" name="liveMode" id="liveModeOff" /> <span id="liveModeOffLabel"></span></label>
      </div>
      <div class="cdnSelect" id="liveSelect">
        <button type="button" class="cdnSelectTrigger" id="liveSelectTrigger">
          <span class="cdnSelectText">
            <span class="cdnSelectName" id="liveSelectName"></span>
            <span class="cdnSelectHost" id="liveSelectHost"></span>
          </span>
          <span class="cdnSelectArrow">▾</span>
        </button>
        <div class="cdnSelectList" id="liveSelectList"></div>
      </div>
      <div class="hint" id="liveOffHint" style="display:none"></div>

      <div class="row" style="margin-top:16px">
        <button id="liveSpeedtestBtn" type="button"></button>
      </div>
    </div>

    <hr />

    <div class="footerBtns">
      <button id="rateBtn" type="button" style="display:none"></button>
      <button id="feedbackBtn" type="button" style="display:none"></button>
    </div>

    <div class="versionRow"><button id="versionLink" type="button" class="linkBtn"></button></div>
  </div>

  <div id="changelogView">
    <div class="stHeader">
      <button id="clBackBtn" type="button"></button>
      <b id="clHeaderTitle"></b>
    </div>
    <div id="clList"></div>
  </div>

  <div id="advancedView">
    <div class="stHeader">
      <button id="advBackBtn" type="button"></button>
      <b id="advHeaderTitle"></b>
    </div>

    <div class="advItem">
      <div class="row">
        <span id="uiLangLabel"></span>
        <span class="countryPick"><span id="uiLangText"></span><span class="countryArrow" aria-hidden="true">▾</span><select id="uiLangSelect"></select></span>
      </div>
    </div>

    <div class="advItem">
      <div class="row">
        <span id="uiThemeLabel"></span>
        <span class="countryPick"><span id="uiThemeText"></span><span class="countryArrow" aria-hidden="true">▾</span><select id="uiThemeSelect"></select></span>
      </div>
    </div>

    <div class="advItem">
      <div class="row">
        <span id="autoFallbackLabel"></span>
        <label class="switch"><input type="checkbox" id="autoFallback" /><span class="slider"></span></label>
      </div>
      <div class="hint" id="autoFallbackHint"></div>
    </div>

    <div class="advItem">
      <div class="advTitle" id="stVideoLimitTitle"></div>
      <div class="hint" id="stVideoLimitHint"></div>
      <div class="numRow"><span id="stVideoMbLabel"></span><span><input type="number" id="stVideoMb" min="1" max="100" step="1" /><span class="unit">MB</span></span></div>
      <div class="numRow"><span id="stVideoSecLabel"></span><span><input type="number" id="stVideoSec" min="1" max="60" step="1" /><span class="unit" id="stVideoSecUnit"></span></span></div>
      <div class="linkRow"><button type="button" class="linkBtn" id="stVideoReset"></button></div>
    </div>

    <div class="advItem">
      <div class="advTitle" id="stLiveLimitTitle"></div>
      <div class="hint" id="stLiveLimitHint"></div>
      <div class="numRow"><span id="stLiveRunsLabel"></span><span><input type="number" id="stLiveRuns" min="1" max="10" step="1" /><span class="unit" id="stLiveRunsUnit"></span></span></div>
      <div class="numRow"><span id="stLiveSecLabel"></span><span><input type="number" id="stLiveSec" min="3" max="60" step="1" /><span class="unit" id="stLiveSecUnit"></span></span></div>
      <div class="linkRow"><button type="button" class="linkBtn" id="stLiveReset"></button></div>
    </div>

    <div class="advItem">
      <div class="row">
        <span id="sortBySpeedLabel"></span>
        <label class="switch"><input type="checkbox" id="sortBySpeed" /><span class="slider"></span></label>
      </div>
      <div class="hint" id="sortBySpeedHint"></div>
    </div>

    <div class="advItem">
      <div class="row">
        <span id="autoSpeedSwitchLabel"></span>
        <label class="switch"><input type="checkbox" id="autoSpeedSwitch" /><span class="slider"></span></label>
      </div>
      <div class="hint" id="autoSpeedSwitchHint"></div>
      <div class="hint advDisabledNote" id="autoSpeedSwitchAllNote" style="display:none"></div>
    </div>

    <div class="advItem">
      <div class="row">
        <span id="showDebugLabel"></span>
        <label class="switch"><input type="checkbox" id="showDebug" /><span class="slider"></span></label>
      </div>
      <div class="hint" id="showDebugHint"></div>
      <div id="debugSection" style="display:none">
        <div class="row" style="margin:10px 0 6px"><label id="debugSectionLabel"></label></div>
        <div id="debug"></div>
      </div>
    </div>

    <div class="resetAllRow"><button type="button" class="linkBtn" id="resetAllBtn"></button></div>
  </div>

  <div id="speedtestView">
    <div class="stHeader">
      <button id="stBackBtn" type="button"></button>
      <b id="stHeaderTitle"></b>
    </div>
    <div id="stMeta"></div>
    <div id="stDesc">
      <div id="stDescInner">
        <div class="hint" id="stHintLeave"></div>
        <div class="hint" id="stHintBandwidth"></div>
        <button id="stDescToggle" type="button"></button>
      </div>
    </div>
    <div class="stActions">
      <button id="stRetestBtn" type="button"></button>
      <button id="stStopBtn" type="button" disabled></button>
    </div>
    <div id="stList"></div>
  </div>

  <div id="allWarn" role="alertdialog" aria-modal="true" aria-labelledby="awTitle">
    <div class="awCard">
      <div class="awHead">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z" />
        </svg>
        <span id="awTitle"></span>
      </div>
      <div id="awBody"></div>
      <div class="awBtns">
        <button id="awCancel" type="button"></button>
        <button id="awConfirm" type="button"></button>
      </div>
    </div>
  </div>

  <div id="whatsNew" role="dialog" aria-modal="true" aria-labelledby="wnTitle">
    <div class="wnCard">
      <div class="wnHeader">
        <span id="wnTitle"></span>
        <button id="wnX" type="button" aria-label="close">&times;</button>
      </div>
      <div id="wnSubtitle"></div>
      <ul id="wnList"></ul>
      <button id="wnClose" type="button"></button>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>

</html>
